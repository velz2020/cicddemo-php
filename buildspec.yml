version: 0.2

phases:
  install:
    runtime-versions:
      php: 8.3
    commands:
      - php -v
      - composer --version

  pre_build:
    commands:
      - composer install --no-dev --optimize-autoloader

  build:
    commands:
      - echo "Building PHP application..."

  post_build:
    commands:
      - echo "========================================"
      - echo "PHP APPLICATION BUILD COMPLETED"
      - echo "========================================"
      - 'COMMIT_MESSAGE=$(git log -1 --pretty=%B)'
      - 'echo "Build Status: SUCCESS" > build-info.txt'
      - 'echo "Commit SHA: $CODEBUILD_RESOLVED_SOURCE_VERSION" >> build-info.txt'
      - 'echo "Commit Message: $COMMIT_MESSAGE" >> build-info.txt'
      - 'echo "Build Time: $(date)" >> build-info.txt'
      - echo "========================================"
      - cat build-info.txt
      - echo "========================================"

artifacts:
  files:
    - '**/*'
  name: php-app-build