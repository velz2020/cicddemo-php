version: 0.2

phases:
  install:
    runtime-versions:
      php: 8.3
    commands:
      - php -v
      - composer --version

  pre_build:
    commands:
      - composer install --no-dev --optimize-autoloader

  build:
    commands:
      - echo "Building PHP application..."

  post_build:
    commands:
      - echo "Build completed"
      - 'echo "================================="'
      - 'echo "BUILD DEBUG"'
      - 'echo "Commit: $CODEBUILD_RESOLVED_SOURCE_VERSION"'
      - 'echo "Date: $(date)"'
      - 'echo "================================="'
      - 'echo "Commit: $CODEBUILD_RESOLVED_SOURCE_VERSION" > build-info.txt'
      - 'echo "Build time: $(date)" >> build-info.txt'
      - 'echo "Build hostname: $(hostname)" >> build-info.txt'

artifacts:
  files:
    - '**/*'
  name: php-app-build